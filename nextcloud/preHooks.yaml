apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data
spec:
  storageClassName: nextcloud-data
  capacity:
    storage: 3Ti
  accessModes:
    - ReadWriteOnce
  nfs:
    path: /mnt/ZFS-3.6TB/tank/nextcloud-data
    server: truenas-1.tgp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-exec-runner
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
      - get
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-exec-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-exec-runner
subjects:
  - kind: ServiceAccount
    name: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-extra-mounts
data:
  previews.config.php: |
    <?php
      $CONFIG = array(
        'enable_previews' => true,
        'enabledPreviewProviders' => [
          'OC\Preview\BMP',
          'OC\Preview\GIF',
          'OC\Preview\JPEG',
          'OC\Preview\Krita',
          'OC\Preview\MarkDown',
          'OC\Preview\MP3',
          'OC\Preview\OpenDocument',
          'OC\Preview\PNG',
          'OC\Preview\TXT',
          'OC\Preview\XBitmap',
          'OC\Preview\Movie',
          'OC\Preview\MKV',
          'OC\Preview\MP4',
          'OC\Preview\AVI',
          'OC\Preview\PDF'
        ]
      );
