# Override values for Nextcloud

## Official nextcloud image + my customizations (user dennis/uid 1000, preview deps),
## built from FlipEnergy/container-images (nextcloud/); tags mirror upstream.
## ref: https://hub.docker.com/r/flipenergy/nextcloud/tags
## Nextcloud only upgrades one major version at a time (the entrypoint refuses
## otherwise). For a new major: make sure images-build has a job for it, run
## `occ app:update --all`, suspend the nextcloud cronjobs, then bump the tag.
## The upgrade's rsync over NFS takes ~1h; liveness/startup probes are off so
## the pod isn't restarted mid-upgrade.
image:
  repository: flipenergy/nextcloud
  tag: 35.0.2-apache

## Allowing use of ingress controllers
## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
##
ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-homelab"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 1G
  tls:
    - secretName: nextcloud-tls
      hosts:
        - cloud.pleasenoddos.com

phpClientHttpsFix:
  enabled: true

nextcloud:
  host: cloud.pleasenoddos.com

  mail:
    enabled: true
    fromAddress: dennis.zhang.nrg
    domain: gmail.com
    smtp:
      host: smtp.gmail.com
      secure: tls
      port: 587

  extraInitContainers:
    # create empty redis file for nextcloud entrypoint to override it
    - name: init-redis-session-ini
      image: busybox
      command:
        - sh
        - -c
        - |
          touch /usr/local/etc/php/conf.d/redis-session.ini
          chown -v 33:33 /usr/local/etc/php/conf.d/redis-session.ini
      volumeMounts:
        - name: nextcloud-redis-session-ini
          mountPath: /usr/local/etc/php/conf.d

  # Extra mounts for the pods. Example shown is for connecting a legacy NFS volume
  # to NextCloud pods in Kubernetes. This can then be configured in External Storage
  extraVolumes:
    - name: nextcloud-redis-session-ini
      emptyDir: {}
    - name: extra-mounts
      configMap:
        name: nextcloud-extra-mounts

  extraVolumeMounts:
    - name: nextcloud-redis-session-ini
      mountPath: "/usr/local/etc/php/conf.d/redis-session.ini" # fix permission denied error
      subPath: redis-session.ini
    - name: extra-mounts
      mountPath: /var/www/html/config/previews.config.php
      subPath: previews.config.php
      readOnly: true

  ##
  ## Extra environment variables
  extraEnv:
    # base URL for links generated outside a web request (cron jobs, emails, occ);
    # read by reverse-proxy.config.php (refreshed from the image on 2026-11-08)
    - name: OVERWRITECLIURL
      value: https://cloud.pleasenoddos.com
    - name: REDIS_HOST
      value: redis-master.redis
    - name: PHP_MEMORY_LIMIT
      value: 4G
    - name: PHP_UPLOAD_LIMIT
      value: 20G

internalDatabase:
  enabled: false

##
## External database configuration
##
externalDatabase:
  enabled: true
  ## Supported database engines: mysql or postgresql
  type: postgresql
  ## Database host
  host: postgresql.postgresql

persistence:
  # Nextcloud Data (/var/www/html)
  enabled: true
  # static NFS PV, see nextcloud/preHooks.yaml
  storageClass: nextcloud-data
  size: 3Ti

resources:
  limits:
    memory: 4Gi
  requests:
    cpu: 2
    memory: 2Gi

nodeSelector:
  performance: high

## Liveness and readiness probe values
## Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#container-probes
##
livenessProbe:
  enabled: false
  timeoutSeconds: 10
  failureThreshold: 6
readinessProbe:
  timeoutSeconds: 10
  failureThreshold: 10
startupProbe:
  periodSeconds: 30
  failureThreshold: 60
