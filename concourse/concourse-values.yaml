# Overrides for the concourse/concourse chart (only values that differ from the chart defaults).
# Defaults: helm show values concourse/concourse --version <version in homelab.yaml>
concourse:
  web:
    clusterName: Homelab
    enableBuildRerunWhenWorkerDisappears: true
    secretCacheEnabled: true
    logLevel: error
    externalUrl: http://concourse.computersbarely.work
    postgres:
      host: postgresql.postgresql
      database: concourse
    kubernetes:
      enabled: false
      createTeamNamespaces: false
      keepNamespaces: false
    auth:
      duration: 2200h
      mainTeam:
        localUser: "FlipEnergy"
    tsa:
      logLevel: error
  worker:
    logLevel: error
    runtime: containerd
    baggageclaim:
      logLevel: error
web:
  nodeSelector:
    performance: medium
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-homelab"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    hosts:
      - concourse.computersbarely.work
    tls:
      - secretName: concourse-tls
        hosts:
          - concourse.computersbarely.work
worker:
  kind: Deployment
  resources:
    requests:
      cpu: "200m"
persistence:
  enabled: false
postgresql:
  enabled: false
rbac:
  create: false
