# Overrides for the concourse/concourse chart (only values that differ from the chart defaults).
# Defaults: helm show values concourse/concourse --version <version in homelab.yaml>
concourse:
  web:
    clusterName: Homelab
    enableBuildRerunWhenWorkerDisappears: true
    secretCacheEnabled: true
    logLevel: error
    externalUrl: http://concourse.computersbarely.work
    postgres:
      host: postgresql.postgresql
      database: concourse
    kubernetes:
      enabled: false
      createTeamNamespaces: false
      keepNamespaces: false
    auth:
      duration: 2200h
      mainTeam:
        localUser: "FlipEnergy"
    tsa:
      logLevel: error
  worker:
    logLevel: error
    runtime: containerd
    baggageclaim:
      logLevel: error
web:
  nodeSelector:
    performance: medium
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-homelab"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    hosts:
      - concourse.computersbarely.work
    tls:
      - secretName: concourse-tls
        hosts:
          - concourse.computersbarely.work
worker:
  kind: Deployment
  replicas: 3
  # Talos only supports nftables: put iptables -> xtables-nft-multi links in
  # /usr/local/sbin, first on the image's PATH.
  extraInitContainers:
    - name: iptables-nft
      image: busybox:1.38.0
      command:
        - sh
        - -c
        - for b in iptables iptables-save iptables-restore ip6tables ip6tables-save ip6tables-restore; do ln -sf /usr/sbin/xtables-nft-multi /nft/$b; done
      volumeMounts:
        - name: iptables-nft
          mountPath: /nft
    # Talos drops CAP_SYS_MODULE and CAP_SYS_BOOT from every process, but Concourse
    # requests them for privileged tasks, so runc fails with "unable to apply caps".
    # Install a runc wrapper that strips them from the OCI spec. The shim finds runc
    # via PATH, and /opt/containerd/bin comes before /usr/local/concourse/bin.
    - name: runc-wrapper
      image: busybox:1.38.0
      command:
        - sh
        - -c
        - printf '%s\n' "$WRAPPER" > /wrap/runc && chmod 755 /wrap/runc
      env:
        - name: WRAPPER
          value: |
            #!/bin/sh
            strip() {
              [ -f "$1" ] && sed -i -E \
                -e 's/"CAP_SYS_(MODULE|BOOT)"[[:space:]]*,[[:space:]]*//g' \
                -e 's/,[[:space:]]*"CAP_SYS_(MODULE|BOOT)"//g' "$1"
            }
            prev=""
            for a in "$@"; do
              case "$prev" in
                --bundle|-b) strip "$a/config.json" ;;
                --process|-p) strip "$a" ;;
              esac
              case "$a" in
                --bundle=*) strip "${a#--bundle=}/config.json" ;;
                --process=*) strip "${a#--process=}" ;;
              esac
              prev="$a"
            done
            exec /usr/local/concourse/bin/runc "$@"
      volumeMounts:
        - name: runc-wrapper
          mountPath: /wrap
  additionalVolumes:
    - name: iptables-nft
      emptyDir: {}
    - name: runc-wrapper
      emptyDir: {}
  additionalVolumeMounts:
    - name: iptables-nft
      mountPath: /usr/local/sbin
    - name: runc-wrapper
      mountPath: /opt/containerd/bin
  resources:
    requests:
      cpu: "200m"
persistence:
  enabled: false
postgresql:
  enabled: false
rbac:
  create: false
