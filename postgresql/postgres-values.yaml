# Overrides for the bitnami postgresql chart (only values that differ from the chart defaults).
global:
  # Existing roles (postgres, nextcloud, concourse) still have MD5 password hashes, which
  # FIPS mode rejects. Re-enable once they've been reset to SCRAM-SHA-256.
  defaultFips: "off"
image:
  # Bitnami only publishes a rolling `latest` tag; pin by digest. This is PostgreSQL 18.6.0.
  # A new major version needs a dump/restore, so don't bump this blindly.
  digest: sha256:b418fd5f001c272aad93ac1febf783f543ee45d8e359d58bd5afc3d2a9b62290
primary:
  livenessProbe:
    enabled: false
  startupProbe:
    enabled: true
    initialDelaySeconds: 60
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 2
      memory: 2Gi
  podSecurityContext:
    fsGroup: 1000
  containerSecurityContext:
    runAsUser: 1000
  nodeSelector:
    performance: high
  persistence:
    storageClass: postgresql-data
    size: 10Gi
volumePermissions:
  resources:
    limits: {}
    requests: {}
