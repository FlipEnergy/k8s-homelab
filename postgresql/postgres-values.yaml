# Overrides for the bitnami postgresql chart (only values that differ from the chart defaults).
global:
  security:
    # Required for the bitnamilegacy image below (not in the chart's image allowlist).
    allowInsecureImages: true
  # The pinned 16.x image predates the chart's FIPS support.
  defaultFips: "off"
image:
  # Versioned bitnami tags were moved to bitnamilegacy in Aug 2025; same digest as the old docker.io/bitnami image.
  repository: bitnamilegacy/postgresql
  tag: 16.4.0-debian-12-r16
primary:
  livenessProbe:
    enabled: false
  startupProbe:
    enabled: true
    initialDelaySeconds: 60
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 2
      memory: 2Gi
  podSecurityContext:
    fsGroup: 1000
  containerSecurityContext:
    runAsUser: 1000
  nodeSelector:
    performance: high
  persistence:
    storageClass: postgresql-data
    size: 10Gi
volumePermissions:
  resources:
    limits: {}
    requests: {}
