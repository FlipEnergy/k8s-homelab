# Overrides for the bitnami postgresql chart (only values that differ from the chart defaults).
image:
  tag: 16.4.0-debian-12-r16
primary:
  livenessProbe:
    enabled: false
  startupProbe:
    enabled: true
    initialDelaySeconds: 60
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 2
      memory: 2Gi
  podSecurityContext:
    fsGroup: 1000
  containerSecurityContext:
    runAsUser: 1000
  nodeSelector:
    performance: high
  persistence:
    storageClass: postgresql-data
    size: 10Gi
volumePermissions:
  image:
    repository: bitnami/bitnami-shell
    tag: 11-debian-11-r136
  resources:
    limits: {}
    requests: {}
