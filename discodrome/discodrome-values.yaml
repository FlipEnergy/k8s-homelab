# Override values for discodrome

# https://github.com/7eventy7/discodrome
# Discord bot only: it makes outbound connections and listens on no ports.

controllers:
  main:
    # The bot writes bot.log, guild_properties.pickle and cache/ into its working
    # directory /app, which the image leaves root-owned. Copy /app into an emptyDir
    # so it can run as non-root.
    initContainers:
      copy-app:
        image:
          repository: 7eventy7/discodrome
          tag: v1.1.0
          pullPolicy: IfNotPresent
        command: ["cp", "-a", "/app/.", "/work/"]
        securityContext: &container-security
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
    containers:
      main:
        image:
          # -- image repository
          repository: 7eventy7/discodrome
          # -- image tag
          # @default -- chart.appVersion
          tag: v1.1.0
          # -- image pull policy
          pullPolicy: IfNotPresent

        # Secret values come from the Secret built from discodrome-secrets.yaml
        envFrom:
          - secretRef:
              identifier: main
        env:
          SUBSONIC_SERVER: http://gonic.gonic.svc.cluster.local:4747

        securityContext: *container-security

        resources:
          limits:
            memory: 500Mi
          requests:
            cpu: 50m
            memory: 150Mi

defaultPodOptions:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    performance: medium

service:
  main:
    enabled: false
    controller: main

persistence:
  app:
    type: emptyDir
    advancedMounts:
      main:
        copy-app:
          - path: /work
        main:
          - path: /app
